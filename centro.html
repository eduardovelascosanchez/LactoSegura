<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro Pediátrico · Dr. Eduardo Velasco</title>
<meta name="theme-color" content="#FBF5EF">
<meta name="description" content="Centro pediátrico con consulta del recién nacido al adolescente: control del niño sano, vacunación, lactancia, nutrición y urgencias pediátricas.">
<meta property="og:title" content="Centro Pediátrico · Dr. Eduardo Velasco">
<meta property="og:description" content="Pediatría cercana para cada etapa. Consulta, control del niño sano, vacunación y acompañamiento en lactancia.">
<meta property="og:type" content="website">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --milk:#FBF5EF; --milk-2:#F4EAE1; --paper:#FFFFFF;
    --ink:#43303A; --ink-soft:#6E5A63; --ink-faint:#9C8890; --line:#EBDDD4;
    --rose:#C97C8A; --rose-deep:#A85C6C; --rose-tint:#F7E9EC;
    --mint:#3F9E7E; --mint-tint:#E4F1EB; --sun:#CF9A2E; --sun-tint:#F6EDD6;
    --alert:#CB5A5A; --alert-tint:#F7E0DF;
    --shadow:0 10px 30px -14px rgba(67,48,58,.28);
    --shadow-lg:0 24px 60px -28px rgba(67,48,58,.45);
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --bar:60px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bar) + 12px)}
  html,body{margin:0;padding:0}
  body{background:var(--milk);color:var(--ink);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  ::selection{background:var(--rose-tint)}
  img{max-width:100%}
  a{color:var(--rose-deep)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;width:100%}

  /* ---------- barra superior ---------- */
  .bar{position:sticky;top:0;z-index:40;background:rgba(251,245,239,.92);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
  .bar-in{display:flex;align-items:center;gap:12px;height:var(--bar)}
  .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:0 1 auto;min-width:0}
  .logo .mark{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(45deg);
    background:linear-gradient(140deg,var(--rose),var(--rose-deep));display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .logo .mark svg{transform:rotate(-45deg);color:#fff}
  .logo b{font-family:var(--serif);font-weight:600;font-size:16.5px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo b em{font-style:italic;color:var(--rose-deep)}
  .nav{display:none;gap:2px;margin-left:auto;align-items:center;min-width:0;
    overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{font-size:13.2px;font-weight:600;color:var(--ink-soft);text-decoration:none;
    padding:8px 10px;border-radius:999px;transition:.16s;white-space:nowrap}
  .nav a:hover{background:var(--milk-2);color:var(--ink)}
  .nav a.on{background:var(--rose-tint);color:var(--rose-deep)}
  .bar .cta{margin-left:auto;flex:0 0 auto}
  .nav + .cta{margin-left:8px}
  @media(max-width:899px){.bar .cta{display:none}}
  .burger{margin-left:auto;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;
    width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft)}
  .menu{display:none;border-top:1px solid var(--line);background:var(--milk);padding:8px 0 14px}
  .menu.open{display:block}
  .menu a{display:block;padding:11px 4px;font-size:15px;font-weight:600;color:var(--ink-soft);
    text-decoration:none;border-bottom:1px solid var(--line)}
  .menu a:last-child{border-bottom:0}
  .menu .btn{display:flex;width:100%;margin:12px 0 4px;border-bottom:0}
  @media(min-width:900px){
    .nav{display:flex}
    .burger{display:none}
    .menu{display:none !important}
  }

  /* ---------- botones ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;
    border-radius:999px;padding:11px 20px;font-size:14.5px;font-weight:700;font-family:var(--sans);
    cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .18s,background .16s,border-color .16s}
  .btn:active{transform:translateY(1px)}
  .btn.primario{background:var(--rose);color:#fff;box-shadow:var(--shadow)}
  .btn.primario:hover{background:var(--rose-deep)}
  .btn.secundario{background:var(--paper);border-color:var(--line);color:var(--ink)}
  .btn.secundario:hover{border-color:var(--rose);color:var(--rose-deep)}
  .btn.chico{padding:9px 16px;font-size:13.5px}

  /* ---------- secciones ---------- */
  .sec{padding:56px 0}
  .sec.fondo-crema{background:var(--milk-2)}
  .sec.fondo-blanco{background:var(--paper)}
  .sec.fondo-rosa{background:var(--rose-tint)}
  .sec.fondo-menta{background:var(--mint-tint)}
  @media(min-width:760px){.sec{padding:74px 0}}
  .kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);font-weight:700;margin:0 0 8px}
  .sec h2{font-family:var(--serif);font-weight:600;font-size:clamp(25px,4.6vw,35px);line-height:1.12;
    letter-spacing:-.015em;margin:0 0 10px}
  .sec h2 em{font-style:italic;color:var(--rose-deep)}
  .intro{font-size:15.5px;color:var(--ink-soft);margin:0;max-width:62ch}
  .head{margin-bottom:28px}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FBEEF0 0%,var(--milk) 72%);
    padding:44px 0 0}
  .hero .curve{position:absolute;left:0;bottom:-1px;width:100%;height:40px;color:var(--milk);display:block}
  .hero-in{position:relative;z-index:2;padding-bottom:58px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(33px,7.6vw,54px);line-height:1.03;
    letter-spacing:-.02em;margin:10px 0 14px;max-width:16ch}
  .hero h1 em{font-style:italic;color:var(--rose-deep)}
  .hero .intro{font-size:16.5px;max-width:52ch}
  .hero-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  .hero-datos{display:grid;gap:10px;margin-top:32px;grid-template-columns:1fr}
  @media(min-width:680px){.hero-datos{grid-template-columns:repeat(3,1fr)}}
  .dato{display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:13px 15px;font-size:13.8px;font-weight:600;color:var(--ink-soft);box-shadow:0 2px 8px -6px rgba(67,48,58,.25)}
  .dato .ic{color:var(--rose);flex:0 0 auto}

  /* ---------- rejilla genérica ---------- */
  .grid{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:640px){.grid.dos,.grid.tres{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:920px){.grid.tres{grid-template-columns:repeat(3,1fr)}}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;
    box-shadow:0 2px 10px -8px rgba(67,48,58,.3);transition:transform .16s,box-shadow .2s,border-color .2s;height:100%}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#E4D2CB}
  .card .ic-box{width:42px;height:42px;border-radius:50% 50% 50% 0;transform:rotate(45deg);
    background:var(--rose-tint);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .card .ic-box svg{transform:rotate(-45deg);color:var(--rose-deep)}
  .card h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
  .card p{margin:0;font-size:14.2px;color:var(--ink-soft)}

  /* ---------- edades ---------- */
  .edad-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 18px 20px;
    position:relative;overflow:hidden;box-shadow:0 2px 10px -8px rgba(67,48,58,.3);transition:transform .16s,box-shadow .2s}
  .edad-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rose)}
  .edad-card:nth-child(2n):before{background:var(--mint)}
  .edad-card:nth-child(3n):before{background:var(--sun)}
  .edad-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .edad-pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:var(--milk-2);color:var(--ink-soft);border-radius:999px;padding:5px 11px;margin-bottom:10px}
  .edad-card h3{font-family:var(--serif);font-weight:600;font-size:18.5px;margin:0 0 5px}
  .edad-card p{margin:0;font-size:14px;color:var(--ink-soft)}

  /* ---------- pasos ---------- */
  .pasos{display:grid;gap:14px;grid-template-columns:1fr;counter-reset:paso}
  @media(min-width:640px){.pasos{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:980px){.pasos{grid-template-columns:repeat(4,1fr)}}
  .paso{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
  .paso .num{width:34px;height:34px;border-radius:999px;background:var(--rose);color:#fff;
    font-family:var(--serif);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .paso h3{font-family:var(--serif);font-weight:600;font-size:17.5px;margin:0 0 5px}
  .paso p{margin:0;font-size:14px;color:var(--ink-soft)}

  /* ---------- lista ---------- */
  .lista{display:grid;gap:10px;grid-template-columns:1fr;margin:0;padding:0;list-style:none}
  @media(min-width:760px){.lista{grid-template-columns:repeat(2,1fr)}}
  .lista li{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px;font-size:14.3px;color:var(--ink-soft)}
  .lista li svg{flex:0 0 auto;margin-top:2px;color:var(--mint)}
  .alerta .lista li svg{color:var(--alert)}
  .alerta .lista li{border-color:#F0D0D0}
  .nota{margin:18px 0 0;font-size:13px;color:var(--ink-soft);font-style:italic}

  /* ---------- perfil ---------- */
  .perfil{display:grid;gap:22px;grid-template-columns:1fr;align-items:start}
  @media(min-width:860px){.perfil{grid-template-columns:1fr 1fr;gap:38px}}
  .perfil-cred{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
  .perfil-cred h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 12px}
  .perfil-cred ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
  .perfil-cred li{display:flex;gap:10px;align-items:flex-start;font-size:14.2px;color:var(--ink-soft)}
  .perfil-cred li svg{flex:0 0 auto;margin-top:3px;color:var(--rose)}
  .perfil .sub{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--rose-deep);margin:0 0 12px}
  .perfil p.bio{font-size:15.2px;color:var(--ink-soft);margin:0 0 18px}

  /* ---------- horarios ---------- */
  .hor{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:800px){.hor{grid-template-columns:1.1fr .9fr}}
  .hor-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 20px;box-shadow:0 2px 10px -8px rgba(67,48,58,.3)}
  .hor-row{display:flex;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .hor-row:last-child{border-bottom:0}
  .hor-row b{font-weight:600}
  .hor-row span{color:var(--ink-soft);text-align:right}
  .lugar{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 2px 10px -8px rgba(67,48,58,.3)}
  .lugar h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 8px}
  .lugar p{margin:0 0 6px;font-size:14.3px;color:var(--ink-soft)}
  .lugar .det{font-size:13px;color:var(--ink-faint)}

  /* ---------- testimonios ---------- */
  .quote{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;height:100%;
    display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 10px -8px rgba(67,48,58,.3)}
  .quote .mk{font-family:var(--serif);font-size:40px;line-height:.6;color:var(--rose);opacity:.55}
  .quote p{margin:0;font-size:14.8px;color:var(--ink-soft);font-style:italic;flex:1}
  .quote .autor{font-family:var(--serif);font-weight:600;font-size:15px}
  .quote .det{font-size:12.5px;color:var(--ink-faint)}

  /* ---------- faq ---------- */
  .faq{display:grid;gap:10px}
  .faq details{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .faq details[open]{border-color:var(--rose);box-shadow:0 2px 12px -8px rgba(67,48,58,.35)}
  .faq summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:14px;align-items:center;
    justify-content:space-between;font-weight:600;font-size:15.2px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary .sg{flex:0 0 auto;width:24px;height:24px;border-radius:999px;background:var(--milk-2);
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;transition:.2s}
  .faq details[open] summary .sg{background:var(--rose);color:#fff;transform:rotate(45deg)}
  .faq .r{padding:0 18px 18px;font-size:14.4px;color:var(--ink-soft)}

  /* ---------- cta ---------- */
  .cta-box{text-align:center;max-width:56ch;margin:0 auto}
  .cta-box h2{margin-bottom:8px}
  .cta-box .intro{margin:0 auto 22px}
  .cta-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

  /* ---------- contacto ---------- */
  .cont-card{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);
    border-radius:18px;padding:18px;text-decoration:none;color:inherit;transition:transform .16s,border-color .18s,box-shadow .2s}
  .cont-card:hover{transform:translateY(-3px);border-color:var(--rose);box-shadow:var(--shadow)}
  .cont-card .ic{width:38px;height:38px;border-radius:12px;background:var(--rose-tint);color:var(--rose-deep);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cont-card b{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .cont-card span{font-size:14.8px;color:var(--ink);word-break:break-word}

  /* ---------- aviso ---------- */
  .aviso{display:flex;gap:11px;align-items:flex-start;background:var(--sun-tint);border:1px solid #EBDCB8;
    border-radius:16px;padding:14px 16px;font-size:13.2px;color:#7A5A16}
  .aviso svg{flex:0 0 auto;margin-top:2px}

  /* ---------- texto libre ---------- */
  .cuerpo{font-size:15.2px;color:var(--ink-soft);max-width:68ch}
  .cuerpo h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin:24px 0 8px}
  .cuerpo p{margin:0 0 14px}
  .cuerpo ul,.cuerpo ol{margin:0 0 14px;padding-left:20px}
  .cuerpo li{margin:5px 0}

  /* ---------- pie ---------- */
  footer{border-top:1px solid var(--line);background:var(--milk-2);padding:34px 0 40px;font-size:13px;color:var(--ink-soft)}
  footer .f-grid{display:grid;gap:22px;grid-template-columns:1fr}
  @media(min-width:760px){footer .f-grid{grid-template-columns:1.2fr 1fr 1fr}}
  footer .f-name{font-family:var(--serif);color:var(--ink);font-size:16px;margin:0 0 8px}
  footer h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
  footer p{margin:0 0 7px}
  footer a{color:var(--rose-deep);text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .f-links{display:grid;gap:7px}
  .f-fine{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint)}

  /* ---------- animación de entrada ---------- */
  .rev{opacity:0;transform:translateY(14px)}
  .rev.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.22,1,.36,1)}
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .rev,.rev.in{opacity:1;transform:none;transition:none}
    .card:hover,.edad-card:hover,.cont-card:hover,.quote:hover{transform:none}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar-in">
    <a class="logo" href="#inicio">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 11c0 5.5-7 10-7 10z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>
      <b id="logo-txt"></b>
    </a>
    <nav class="nav" id="nav"></nav>
    <a class="btn primario chico cta" id="cta-bar" href="#contacto">Agendar cita</a>
    <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="menu" id="menu"><div class="wrap" id="menu-links"></div></div>
</div>

<main id="secciones"></main>

<footer>
  <div class="wrap">
    <div class="f-grid">
      <div>
        <p class="f-name" id="f-name"></p>
        <p id="f-lema"></p>
        <p id="f-medico"></p>
      </div>
      <div>
        <h4>Contacto</h4>
        <p id="f-tel"></p>
        <p id="f-mail"></p>
        <p id="f-dir"></p>
      </div>
      <div>
        <h4>Secciones</h4>
        <div class="f-links" id="f-links"></div>
      </div>
    </div>
    <p class="f-fine">
      Este sitio tiene fines <b>informativos</b> y no sustituye la consulta médica ni establece una relación médico-paciente.
      Ante una urgencia acude al servicio de urgencias más cercano.
      © <span id="yr"></span> <span id="f-copy"></span>. Todos los derechos reservados.
    </p>
  </div>
</footer>

<script src="centro-contenido.js"></script>
<script>
/* ==========================================================================
   Motor de la landing: dibuja las secciones definidas en centro-contenido.js
   No necesitas editar este archivo para agregar secciones, solo el contenido.
   ========================================================================== */

/* ---- iconos ---- */
const ICONOS = {
  corazon:'<path d="M12 21s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 11c0 5.5-7 10-7 10z"/>',
  estetoscopio:'<path d="M6 3v5a4 4 0 008 0V3"/><path d="M10 12v2a5 5 0 0010 0v-1"/><circle cx="20" cy="10" r="2"/>',
  biberon:'<path d="M9 8h6v11a3 3 0 01-3 3 3 3 0 01-3-3V8z"/><path d="M10 8V5h4v3"/><path d="M11 2h2"/>',
  jeringa:'<path d="M14 4l6 6"/><path d="M17 7l-9 9-4 1 1-4 9-9z"/><path d="M12 9l3 3"/>',
  escudo:'<path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6l8-3z"/>',
  reloj:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.4A8 8 0 1121 12z"/>',
  mapa:'<path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  telefono:'<path d="M5 3h4l2 5-2.5 1.5a12 12 0 006 6L16 13l5 2v4a2 2 0 01-2.2 2A17 17 0 013 5.2 2 2 0 015 3z"/>',
  correo:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  luna:'<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>',
  hoja:'<path d="M4 20c0-8 5-14 16-14 0 9-5 14-12 14H4z"/><path d="M8 18c2-4 5-7 9-9"/>',
  estrella:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/>',
  alerta:'<path d="M12 3l9 16H3l9-16z"/><path d="M12 10v4M12 17.5v.5"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  bebe:'<circle cx="12" cy="9" r="5"/><path d="M9.5 8.5h.01M14.5 8.5h.01M10 11.5a3 3 0 004 0"/><path d="M5 21c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5"/>',
  nino:'<circle cx="12" cy="7" r="3.5"/><path d="M6 21v-3a6 6 0 0112 0v3"/>',
  familia:'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.5"/><path d="M3 20v-2a5 5 0 0110 0v2M14 20v-1.5a4 4 0 017 0V20"/>',
  libro:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z"/><path d="M8 7h7M8 11h7"/>',
  casa:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>'
};
function icono(nombre, tam){
  const d = ICONOS[nombre] || ICONOS.corazon;
  return '<svg width="'+(tam||20)+'" height="'+(tam||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
         'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
}

/* ---- utilidades ---- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const listaDe = v => Array.isArray(v) ? v : [];
function encabezado(s){
  if(!s.kicker && !s.titulo && !s.intro) return "";
  return '<div class="head">'+
    (s.kicker ? '<p class="kicker">'+s.kicker+'</p>' : '')+
    (s.titulo ? '<h2>'+s.titulo+'</h2>' : '')+
    (s.intro ? '<p class="intro">'+s.intro+'</p>' : '')+
  '</div>';
}
function botones(arr, clase){
  const b = listaDe(arr);
  if(!b.length) return "";
  return '<div class="'+(clase||'hero-btns')+'">'+ b.map(x =>
    '<a class="btn '+(x.estilo==="secundario"?"secundario":"primario")+'" href="'+esc(x.href||"#")+'"'+
    (/^https?:/.test(x.href||"") ? ' target="_blank" rel="noopener"' : '')+'>'+esc(x.texto)+'</a>'
  ).join("")+'</div>';
}

/* ---- dibujantes por tipo de sección ---- */
const DIBUJA = {

  hero: s => '<section class="hero" id="'+esc(s.id)+'">'+
      '<div class="wrap hero-in">'+
        (s.kicker ? '<p class="kicker">'+s.kicker+'</p>' : '')+
        '<h1>'+(s.titulo||"")+'</h1>'+
        (s.intro ? '<p class="intro">'+s.intro+'</p>' : '')+
        botones(s.botones)+
        (listaDe(s.datos).length ? '<div class="hero-datos">'+ listaDe(s.datos).map(d =>
          '<div class="dato"><span class="ic">'+icono(d.icono,19)+'</span>'+esc(d.texto)+'</div>').join("") +'</div>' : '')+
      '</div>'+
      '<svg class="curve" viewBox="0 0 1440 38" preserveAspectRatio="none" fill="currentColor"><path d="M0 38 C 360 4 1080 4 1440 38 Z"/></svg>'+
    '</section>',

  tarjetas: s => '<div class="grid tres">'+ listaDe(s.items).map(i =>
      '<article class="card rev"><div class="ic-box">'+icono(i.icono,20)+'</div>'+
      '<h3>'+esc(i.titulo)+'</h3><p>'+(i.texto||"")+'</p></article>').join("") +'</div>',

  edades: s => '<div class="grid tres">'+ listaDe(s.items).map(i =>
      '<article class="edad-card rev">'+(i.edad?'<span class="edad-pill">'+esc(i.edad)+'</span>':'')+
      '<h3>'+esc(i.titulo)+'</h3><p>'+(i.texto||"")+'</p></article>').join("") +'</div>',

  pasos: s => '<div class="pasos">'+ listaDe(s.items).map((i,n) =>
      '<article class="paso rev"><div class="num">'+(n+1)+'</div>'+
      '<h3>'+esc(i.titulo)+'</h3><p>'+(i.texto||"")+'</p></article>').join("") +'</div>',

  lista: s => '<div class="'+(s.tono==="alerta"?"alerta":"")+'"><ul class="lista">'+
      listaDe(s.items).map(t => '<li class="rev">'+icono(s.tono==="alerta"?"alerta":"check",18)+'<span>'+t+'</span></li>').join("")+
      '</ul>'+(s.nota?'<p class="nota">'+s.nota+'</p>':'')+'</div>',

  perfil: s => '<div class="perfil">'+
      '<div>'+(s.subtitulo?'<p class="sub">'+esc(s.subtitulo)+'</p>':'')+
        (s.texto?'<p class="bio">'+s.texto+'</p>':'')+ botones(s.botones,"hero-btns")+'</div>'+
      (listaDe(s.credenciales).length ? '<div class="perfil-cred rev"><h3>Formación y trayectoria</h3><ul>'+
        listaDe(s.credenciales).map(c => '<li>'+icono("check",17)+'<span>'+c+'</span></li>').join("")+'</ul></div>' : '')+
    '</div>',

  horarios: s => '<div class="hor">'+
      '<div class="hor-card rev">'+ listaDe(s.horario).map(h =>
        '<div class="hor-row"><b>'+esc(h.dia)+'</b><span>'+esc(h.horas)+'</span></div>').join("") +'</div>'+
      (s.lugar ? '<div class="lugar rev"><h3>'+esc(s.lugar.titulo||"Ubicación")+'</h3>'+
        '<p>'+esc(s.lugar.direccion||"")+'</p>'+
        (s.lugar.detalle?'<p class="det">'+esc(s.lugar.detalle)+'</p>':'')+
        (s.lugar.mapa?'<p style="margin-top:14px"><a class="btn secundario chico" target="_blank" rel="noopener" href="'+esc(s.lugar.mapa)+'">'+icono("mapa",17)+' Ver en el mapa</a></p>':'')+
        '</div>' : '')+
    '</div>',

  testimonios: s => '<div class="grid tres">'+ listaDe(s.items).map(i =>
      '<figure class="quote rev" style="margin:0"><div class="mk">&ldquo;</div>'+
      '<blockquote style="margin:0"><p>'+(i.texto||"")+'</p></blockquote>'+
      '<figcaption><div class="autor">'+esc(i.autor)+'</div>'+
      (i.detalle?'<div class="det">'+esc(i.detalle)+'</div>':'')+'</figcaption></figure>').join("") +'</div>',

  faq: s => '<div class="faq">'+ listaDe(s.items).map(i =>
      '<details class="rev"><summary><span>'+esc(i.p)+'</span><span class="sg">+</span></summary>'+
      '<div class="r">'+(i.r||"")+'</div></details>').join("") +'</div>',

  cta: s => '<div class="cta-box">'+
      (s.kicker?'<p class="kicker">'+s.kicker+'</p>':'')+
      (s.titulo?'<h2>'+s.titulo+'</h2>':'')+
      (s.texto?'<p class="intro">'+s.texto+'</p>':'')+
      botones(s.botones,"cta-btns")+'</div>',

  contacto: s => '<div class="grid dos">'+ listaDe(s.items).map(i =>
      '<a class="cont-card rev" href="'+esc(i.href||"#")+'"'+(/^https?:/.test(i.href||"")?' target="_blank" rel="noopener"':'')+'>'+
      '<span class="ic">'+icono(i.icono,19)+'</span><span><b>'+esc(i.titulo)+'</b><span>'+esc(i.texto)+'</span></span></a>').join("") +'</div>',

  texto: s => '<div class="cuerpo rev">'+(s.cuerpo||"")+'</div>',

  aviso: s => '<div class="aviso rev">'+icono("alerta",18)+'<div>'+(s.texto||"")+'</div></div>'
};

/* ---- construcción de la página ---- */
function dibujaSecciones(){
  const main = document.getElementById("secciones");
  const secciones = (typeof SECCIONES !== "undefined") ? SECCIONES : [];
  main.innerHTML = secciones.map(s => {
    const fn = DIBUJA[s.tipo];
    if(!fn){ console.warn('Tipo de sección desconocido: "'+s.tipo+'" (id: '+s.id+')'); return ""; }
    if(s.tipo === "hero") return fn(s);
    const fondo = s.fondo ? " fondo-"+s.fondo : "";
    return '<section class="sec'+fondo+'" id="'+esc(s.id)+'"><div class="wrap">'+encabezado(s)+fn(s)+'</div></section>';
  }).join("");
}

function dibujaNavegacion(){
  const sitio = (typeof SITIO !== "undefined") ? SITIO : {};
  const secciones = (typeof SECCIONES !== "undefined") ? SECCIONES : [];
  const conNav = secciones.filter(s => s.nav);

  document.getElementById("logo-txt").innerHTML =
    esc(sitio.nombre||"Centro Pediátrico")+(sitio.nombreDestacado?' <em>'+esc(sitio.nombreDestacado)+'</em>':'');

  const enlaces = conNav.map(s => '<a href="#'+esc(s.id)+'">'+esc(s.nav)+'</a>').join("");
  const ctaMenu = sitio.ctaMenu ? '<a class="btn primario" href="'+esc(sitio.ctaMenu.href||"#")+'"'+
    (/^https?:/.test(sitio.ctaMenu.href||"") ? ' target="_blank" rel="noopener"' : '')+'>'+esc(sitio.ctaMenu.texto)+'</a>' : '';
  document.getElementById("nav").innerHTML = enlaces;
  document.getElementById("menu-links").innerHTML = enlaces + ctaMenu;
  document.getElementById("f-links").innerHTML = enlaces;

  const cta = document.getElementById("cta-bar");
  if(sitio.ctaMenu){
    cta.textContent = sitio.ctaMenu.texto;
    cta.href = sitio.ctaMenu.href;
    if(/^https?:/.test(sitio.ctaMenu.href||"")){ cta.target="_blank"; cta.rel="noopener"; }
  } else { cta.style.display = "none"; }

  document.getElementById("f-name").innerHTML =
    esc(sitio.nombre||"")+(sitio.nombreDestacado?" "+esc(sitio.nombreDestacado):"");
  document.getElementById("f-lema").textContent = sitio.lema || "";
  document.getElementById("f-medico").textContent = sitio.medico || "";
  document.getElementById("f-copy").textContent = sitio.medico || sitio.nombre || "";
  document.getElementById("f-tel").innerHTML = sitio.telefono ?
    'Tel./WhatsApp: <a href="'+esc(sitio.telefonoLink||sitio.whatsapp||"#")+'">'+esc(sitio.telefono)+'</a>' : "";
  document.getElementById("f-mail").innerHTML = sitio.correo ?
    'Correo: <a href="mailto:'+esc(sitio.correo)+'">'+esc(sitio.correo)+'</a>' : "";
  document.getElementById("f-dir").innerHTML = sitio.direccion ?
    (sitio.mapa ? '<a target="_blank" rel="noopener" href="'+esc(sitio.mapa)+'">'+esc(sitio.direccion)+'</a>' : esc(sitio.direccion)) : "";
  document.getElementById("yr").textContent = new Date().getFullYear();

  const titulo = (sitio.nombre||"")+(sitio.nombreDestacado?" "+sitio.nombreDestacado:"")+(sitio.medico?" · "+sitio.medico:"");
  if(titulo.trim()) document.title = titulo.trim();
}

/* ---- menú móvil ---- */
function menuMovil(){
  const burger = document.getElementById("burger"), menu = document.getElementById("menu");
  burger.addEventListener("click", () => {
    const abierto = menu.classList.toggle("open");
    burger.setAttribute("aria-expanded", abierto ? "true" : "false");
  });
  menu.addEventListener("click", e => {
    if(e.target.closest("a")){ menu.classList.remove("open"); burger.setAttribute("aria-expanded","false"); }
  });
}

/* ---- sección activa en el menú ---- */
function seccionActiva(){
  const enlaces = [...document.querySelectorAll("#nav a")];
  if(!enlaces.length) return;
  const destinos = enlaces.map(a => document.getElementById(a.getAttribute("href").slice(1))).filter(Boolean);
  const obs = new IntersectionObserver(ent => {
    ent.forEach(e => {
      if(!e.isIntersecting) return;
      enlaces.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+e.target.id));
    });
  }, {rootMargin:"-45% 0px -50% 0px"});
  destinos.forEach(d => obs.observe(d));
}

/* ---- aparición al hacer scroll ---- */
function apariciones(){
  const items = [...document.querySelectorAll(".rev")];
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    items.forEach(i => i.classList.add("in")); return;
  }
  const obs = new IntersectionObserver((ent,o) => {
    ent.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
  }, {rootMargin:"0px 0px -8% 0px", threshold:.08});
  items.forEach((el,n) => { el.style.transitionDelay = Math.min(n%6,5)*55+"ms"; obs.observe(el); });
}

dibujaSecciones();
dibujaNavegacion();
menuMovil();
seccionActiva();
apariciones();
</script>
